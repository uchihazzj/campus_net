[package]
name = "campus-net-client"
version = "1.0.0"
edition = "2021"
description = "Windows desktop campus network client based on srun protocol"

[dependencies]
eframe = "0.29"
egui = "0.29"
tray-icon = "0.17"
crossbeam-channel = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
if-addrs = "0.13"
md-5 = "0.10"
sha-1 = "0.10"
base64 = "0.22"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
log = "0.4"

[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
